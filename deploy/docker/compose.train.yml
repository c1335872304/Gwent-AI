name: gwent-trainer

# This Compose project is intentionally separate from compose.cpu.yml. It runs
# the offline RL trainer and never starts the product Core HTTP/BFF/Teacher/Web
# stack.
services:
  trainer:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.train
      args:
        PYTHON_BASE_IMAGE: ${GWENT_TRAIN_PYTHON_BASE_IMAGE:-python:3.10-slim-bookworm}
        TORCH_INDEX_URL: ${GWENT_TRAIN_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${GWENT_TRAIN_TORCH_VERSION:-2.6.0+cpu}
    init: true
    working_dir: /workspace
    user: "${GWENT_TRAIN_UID:-1000}:${GWENT_TRAIN_GID:-1000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace/python/src
      GWENT_PROJECT_ROOT: /workspace
      GWENT_CORE_LIBRARY: /opt/gwent/lib/libgwent_core.so
      LD_LIBRARY_PATH: /opt/gwent/lib
    shm_size: ${GWENT_TRAIN_SHM_SIZE:-1gb}
    volumes:
      # Config/task edits are visible without rebuilding dependency and Core
      # layers; the image still contains a versioned copy for non-dev use.
      - type: bind
        source: ${GWENT_TRAIN_CONFIG_DIR:-../../configs}
        target: /workspace/configs
        read_only: true
      - type: bind
        source: ${GWENT_TRAIN_TASK_DIR:-../../training/tasks}
        target: /workspace/training/tasks
        read_only: true
      # Inputs are read-only. A Trainer must not overwrite the product model.
      - type: bind
        source: ${GWENT_TRAIN_MODEL_DIR:-../../models/v3}
        target: /workspace/models/v3
        read_only: true
      # Outputs remain on the host after a one-off trainer container exits.
      - type: bind
        source: ${GWENT_TRAIN_RUNS_DIR:-../../runs}
        target: /workspace/runs
      - type: bind
        source: ${GWENT_TRAIN_ARTIFACTS_DIR:-../../artifacts}
        target: /workspace/artifacts
