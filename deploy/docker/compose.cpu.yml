name: gwent-local

services:
  core:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.core
      args:
        PYTHON_BASE_IMAGE: ${GWENT_DOCKER_PYTHON_BASE_IMAGE:-python:3.10-slim-bookworm}
        TORCH_INDEX_URL: ${GWENT_DOCKER_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${GWENT_DOCKER_TORCH_VERSION:-2.6.0+cpu}
    environment:
      GWENT_SERVER_MODE: ${GWENT_DOCKER_MODE:-human_vs_ai}
      GWENT_SERVER_CHECKPOINT: /app/models/v3/policy.pt
      GWENT_SERVER_LIBRARY: /opt/gwent/lib/libgwent_core.so
      GWENT_SERVER_DEVICE: cpu
      GWENT_SERVER_HOST: 0.0.0.0
      GWENT_SERVER_PORT: "8008"
    volumes:
      - type: bind
        source: ${GWENT_DOCKER_MODEL_DIR:-../../models/v3}
        target: /app/models/v3
        read_only: true
    expose:
      - "8008"

  bff:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.bff
      args:
        PYTHON_BASE_IMAGE: ${GWENT_DOCKER_PYTHON_BASE_IMAGE:-python:3.10-slim-bookworm}
    environment:
      GWENT_APP_CORE_API_URL: http://core:8008
      GWENT_APP_TEACHER_API_URL: http://teacher:8020
      GWENT_APP_CORS_ORIGINS: http://127.0.0.1:${GWENT_DOCKER_WEB_PORT:-8080},http://localhost:${GWENT_DOCKER_WEB_PORT:-8080}
    depends_on:
      core:
        condition: service_healthy
    expose:
      - "8010"

  # Teacher has no gameplay authority.  It is opt-in so the core product works
  # offline even when explanation dependencies are not desired.
  teacher:
    profiles: ["teacher"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.teacher
      args:
        PYTHON_BASE_IMAGE: ${GWENT_DOCKER_PYTHON_BASE_IMAGE:-python:3.10-slim-bookworm}
    expose:
      - "8020"

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    depends_on:
      bff:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${GWENT_DOCKER_WEB_PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp

  # On-demand Python test environment. It does not start with the product
  # stack and does not require Core/BFF/Teacher for unit and contract tests.
  # The repository is mounted so the fixed dependency image tests the current
  # working tree without rebuilding after every Python edit.
  test:
    profiles: ["test"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.test
      args:
        PYTHON_BASE_IMAGE: ${GWENT_DOCKER_PYTHON_BASE_IMAGE:-python:3.10-slim-bookworm}
        TORCH_INDEX_URL: ${GWENT_DOCKER_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${GWENT_DOCKER_TORCH_VERSION:-2.6.0+cpu}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ../..
        target: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace:/workspace/python/src:/workspace/apps/web/backend
